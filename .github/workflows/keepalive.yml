name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 25 \
            https://wxshop-kol-board.app.workbuddy.host/healthz || echo 000)
          echo "healthz -> $code"
